# Deploy workflow for Azure Container Apps with Azure Database for PostgreSQL Flexible Server
#
# Required secrets (Settings > Secrets and variables > Actions):
#   AZURE_CREDENTIALS         - Azure service principal JSON (az ad sp create-for-rbac --sdk-auth)
#   AZURE_RESOURCE_GROUP      - Resource group name (e.g. rg-kazikashi)
#   AZURE_CONTAINER_REGISTRY  - ACR login server (e.g. kazikashiproduction.azurecr.io)
#   AZURE_REGISTRY_USERNAME   - ACR admin username
#   AZURE_REGISTRY_PASSWORD   - ACR admin password
#   AUTH_SECRET               - NextAuth secret
#   AUTH_GITHUB_ID            - GitHub OAuth Client ID
#   AUTH_GITHUB_SECRET        - GitHub OAuth Client Secret
#   AUTH_GOOGLE_ID            - Google OAuth Client ID
#   AUTH_GOOGLE_SECRET        - Google OAuth Client Secret
#   PG_ADMIN_PASSWORD         - PostgreSQL administrator password
#
# To enable: remove the leading '#' from every line in the 'on:' block and jobs below.

